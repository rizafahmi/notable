name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: mix ci
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.x"
          otp-version: "27"

      # The QR scannability tests decode rendered codes with OpenCV. They are
      # the only check that the animated /qr page still reads on a real phone,
      # so they must run in CI rather than being skipped when cv2 is missing.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # fontTools reads the shipped display .woff2 so the font-coverage tests can
      # prove the wordmark's glyphs are actually in the file. Brotli is what
      # decompresses a WOFF2 table directory.
      - name: Install OpenCV for QR decode tests and fontTools for font coverage tests
        run: python3 -m pip install --disable-pip-version-check opencv-python-headless numpy fonttools brotli

      - name: Cache deps and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run quality gate
        run: mix ci
